# ==============================================================================
# DOXos Kernel & Gaming Performance Tuning
# Inspired by PikaOS low-latency & Slackware rock-solid simplicity
# ==============================================================================

# Critical for Steam Proton (prevents crashes in modern titles)
vm.max_map_count = 2147483642

# Keep RAM snappy, avoid unnecessary disk swapping
vm.swappiness = 10
vm.vfs_cache_pressure = 50

# Increase maximum open file handles and file watches
fs.file-max = 2097152
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024

# Network low latency / BBR queueing
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
